<!doctype html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiceShop | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Prompt', sans-serif; }
        
        body { 
            background: #0f172a; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glow-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
            animation: pulse-slow 8s infinite alternate;
        }

        @keyframes pulse-slow {
            from { transform: scale(1); opacity: 0.5; }
            to { transform: scale(1.3); opacity: 0.8; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spin-slow { animation: spin 6s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-full text-white p-6">

    <div class="glow-bg"></div>

    <div class="max-w-md w-full glass-card rounded-[2.5rem] p-10 text-center relative overflow-hidden">
        <div class="mb-8 relative inline-block">
            <div class="w-24 h-24 border-2 border-orange-500/30 rounded-full flex items-center justify-center">
                <svg class="w-12 h-12 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
            <div class="absolute inset-0 border-b-2 border-orange-500 rounded-full spin-slow"></div>
        </div>

        <h1 class="text-3xl font-bold mb-2 tracking-tight">NiceShop</h1>
        <p class="text-orange-500 text-xs font-semibold uppercase tracking-[0.3em] mb-6">Coming Soon</p>
        
        <div class="space-y-4 mb-10">
            <h2 class="text-xl font-medium text-slate-200">ขออภัย! หน้านี้ยังไม่เปิดใช้งาน</h2>
            <p class="text-slate-400 text-sm leading-relaxed">
                ไนซ์กำลังเร่งพัฒนาหน้าร้านค้าให้พร้อมที่สุด <br>
                อดใจรออีกนิดนะครับ!
            </p>
        </div>

        <div class="w-full bg-slate-800/50 h-1.5 rounded-full overflow-hidden mb-10">
            <div class="bg-gradient-to-r from-orange-600 to-orange-400 h-full w-[75%] animate-pulse"></div>
        </div>

        <a href="index.html" class="inline-flex items-center justify-center w-full py-4 bg-white text-slate-900 rounded-2xl font-bold transition-all hover:bg-orange-500 hover:text-white active:scale-95">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            กลับสู่หน้าหลัก
        </a>
    </div>

</body>
</html>
