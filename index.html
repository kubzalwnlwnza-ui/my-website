<!doctype html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Nice | Digital Business Card</title>
    <meta name="description" content="ติดต่องาน/สอบถามข้อมูล เลือกช่องทางติดต่อด้านล่างได้เลย">
    <meta property="og:title" content="Nice - Digital Business Card">
    <meta property="og:description" content="ติดต่องาน/สอบถามข้อมูล Nice">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Prompt', sans-serif; }
        
        /* พื้นหลังไล่เฉดสี */
        .card-gradient { 
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%); 
        }

        /* ขอบรุ้งหมุนรอบรูปโปรไฟล์ */
        .profile-ring {
            background: conic-gradient(from 0deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
            padding: 4px;
            animation: rotate 4s linear infinite;
        }

        /* เอฟเฟกต์ตัวการ์ดลอยขึ้นลง */
        .float-animation { 
            animation: float 3s ease-in-out infinite; 
        }

        /* สไตล์ปุ่มกด */
        .social-btn { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            background-color: #16213e; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .social-btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            background-color: #1f2d52;
        }

        /* Animations */
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-in { 
            animation: fadeInUp 0.6s ease-out forwards; 
            opacity: 0; 
        }
    </style>
</head>

<body class="h-full">
    <main class="min-h-full w-full card-gradient flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            
            <div class="text-center mb-8 animate-in" style="animation-delay: 0.1s;">
                <div class="profile-ring w-32 h-32 rounded-full mx-auto mb-6 float-animation">
                    <div class="w-full h-full rounded-full flex items-center justify-center text-5xl bg-[#16213e] text-white">
                        👤
                    </div>
                </div>
                <h1 id="ui-name" class="text-3xl font-bold mb-2 text-[#eaeaea]">Nice</h1>
                <p id="ui-job" class="text-lg font-light mb-2 text-[#a0a0a0]">ติดต่องาน/สอบถามข้อมูล</p>
                <p id="ui-bio" class="text-sm max-w-xs mx-auto leading-relaxed text-[#c0c0c0]">เลือกช่องทางติดต่อด้านล่างได้เลย</p>
            </div>

            <div class="space-y-4">
                
                <a id="link-youtube" href="#" target="_blank" class="social-btn block w-full p-4 rounded-2xl flex items-center gap-4 animate-in" style="animation-delay: 0.2s;">
                    <div class="w-12 h-12 rounded-xl bg-red-600 flex items-center justify-center flex-shrink-0 shadow-lg">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-[#eaeaea]">YouTube</p>
                        <p id="sub-youtube" class="text-xs text-[#a0a0a0]">เพลงที่ชอบในช่วงนี้</p>
                    </div>
                    <svg class="w-5 h-5 text-[#a0a0a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>

                <a id="link-line" href="#" target="_blank" class="social-btn block w-full p-4 rounded-2xl flex items-center gap-4 animate-in" style="animation-delay: 0.3s;">
                    <div class="w-12 h-12 rounded-xl bg-[#00b900] flex items-center justify-center flex-shrink-0 shadow-lg">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-[#eaeaea]">LINE</p>
                        <p id="sub-line" class="text-xs text-[#a0a0a0]">ID LINE niceown</p>
                    </div>
                    <svg class="w-5 h-5 text-[#a0a0a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>

                <a id="link-facebook" href="#" target="_blank" class="social-btn block w-full p-4 rounded-2xl flex items-center gap-4 animate-in" style="animation-delay: 0.4s;">
                    <div class="w-12 h-12 rounded-xl bg-[#1877f2] flex items-center justify-center flex-shrink-0 shadow-lg">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-[#eaeaea]">Facebook</p>
                        <p class="text-xs text-[#a0a0a0]">ติดตามฉันบน Facebook</p>
                    </div>
                    <svg class="w-5 h-5 text-[#a0a0a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>

                <a id="link-instagram" href="#" target="_blank" class="social-btn block w-full p-4 rounded-2xl flex items-center gap-4 animate-in" style="animation-delay: 0.5s;">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 shadow-lg" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-[#eaeaea]">Instagram</p>
                        <p class="text-xs text-[#a0a0a0]">ดูรูปภาพของฉัน</p>
                    </div>
                    <svg class="w-5 h-5 text-[#a0a0a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>
            </div>

            <p class="text-center mt-12 text-[10px] tracking-widest uppercase text-[#505050] animate-in" style="animation-delay: 0.6s;">
                © 2026 • Designed by Nice
            </p>
        </div>
    </main>

    <script>
        // --- 1. ข้อมูลส่วนตัว ---
        const MY_INFO = {
            name: "Nice",
            position: "ติดต่องาน/สอบถามข้อมูล",
            bio: "เลือกช่องทางติดต่อด้านล่างได้เลย"
        };

        // --- 2. ลิงก์ปลายทาง (แก้ไขลิงก์ที่นี่) ---
        const MY_LINKS = {
            youtube: "https://www.youtube.com/watch?v=PeuK3febyAY&list=RDPeuK3febyAY&start_radio=1",
            line: "https://line.me/ti/p/hIPTz_WZja", 
            facebook: "https://www.facebook.com/share/17Ko9R6yy2/",
            instagram: "https://www.instagram.com/kkiir_rl?igsh=OWNuOXZtb21nOTdq"
        };

        // --- 3. ข้อความใต้หัวข้อปุ่ม (Sub-text) ---
        const MY_SUBTEXT = {
            youtube: "เพลงที่ชอบในช่วงนี้",
            line: "ID LINE niceown",
            facebook: "ติดตามข่าวสารใหม่ๆ",
            instagram: "@kkiir_rl"
        };

        // --- ฟังก์ชันนำข้อมูลไปใส่ในหน้าเว็บอัตโนมัติ ---
        document.addEventListener('DOMContentLoaded', () => {
            // อัปเดตข้อมูล Profile
            document.getElementById('ui-name').innerText = MY_INFO.name;
            document.getElementById('ui-job').innerText = MY_INFO.position;
            document.getElementById('ui-bio').innerText = MY_INFO.bio;

            // อัปเดตลิงก์ปุ่ม
            document.getElementById('link-youtube').href = MY_LINKS.youtube;
            document.getElementById('link-line').href = MY_LINKS.line;
            document.getElementById('link-facebook').href = MY_LINKS.facebook;
            document.getElementById('link-instagram').href = MY_LINKS.instagram;

            // อัปเดตข้อความรอง (Sub-text)
            document.getElementById('sub-youtube').innerText = MY_SUBTEXT.youtube;
            document.getElementById('sub-line').innerText = MY_SUBTEXT.line;
            // ถ้าคุณต้องการอัปเดต FB/IG ด้วย สามารถเพิ่ม ID ให้ <p> นั้นแล้วสั่งเหมือนด้านบนได้ครับ
        });
    </script>
</body>
</html>
