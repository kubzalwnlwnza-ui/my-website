<!doctype html>
<html lang="en" class="h-full transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice | Digital Business Card</title>
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        /* 1. ตั้งค่าพื้นฐาน */
        * { font-family: 'Prompt', sans-serif; }
        
        /* 2. การจัดการสีพื้นหลัง (โหมดเช้า/กลางคืน) */
        body { 
            background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%); 
            transition: background 0.5s ease; 
        }
        .dark body { 
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); 
        }

        /* 3. สไตล์ของปุ่ม (Glassmorphism) */
        .glass-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .dark .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* เอฟเฟกต์เมื่อเอาเมาส์วาง (Micro-interactions) */
        .glass-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.8);
        }
        .glass-btn:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        /* 4. Animation ตอนเข้าเว็บ */
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .fade-in { opacity: 0; animation: fadeInUp 0.8s ease-out forwards; }
    </style>
</head>

<body class="h-full text-slate-800 dark:text-slate-200">
    
    <div class="fixed top-6 right-6 flex gap-3 z-50 fade-in" style="animation-delay: 0.8s;">
        <button onclick="toggleLang()" class="w-10 h-10 rounded-full glass-btn flex items-center justify-center font-bold text-xs uppercase shadow-sm">
            <span id="lang-label">TH</span>
        </button>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full glass-btn flex items-center justify-center shadow-sm text-lg">
            <span id="theme-icon">🌙</span>
        </button>
    </div>

    <main class="min-h-full w-full flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            
            <div class="mb-12 fade-in" style="animation-delay: 0.1s;">
                <div class="relative w-28 h-28 mx-auto mb-6">
                    <div class="absolute inset-0 rounded-full border-2 border-dashed border-sky-500/30 animate-[spin_15s_linear_infinite]"></div>
                    <div class="w-full h-full rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 shadow-2xl flex items-center justify-center border-4 border-white/10">
                        <span class="text-4xl font-bold text-white tracking-tighter">N</span>
                    </div>
                </div>
                <h1 id="ui-name" class="text-2xl font-semibold tracking-tight dark:text-white mb-1">Nice</h1>
                <p id="ui-job" class="text-sky-600 dark:text-sky-400 text-xs font-medium mb-2 uppercase tracking-widest">Digital Business Card</p>
                <p id="ui-bio" class="text-slate-500 dark:text-slate-400 text-sm font-light px-4">Bio Loading...</p>
            </div>

            <div id="links-container" class="space-y-4">
                </div>

            <p id="ui-footer" class="mt-12 text-[10px] tracking-[0.2em] uppercase text-slate-400 fade-in" style="animation-delay: 0.7s;">
                © 2026 • Nice Digital Card
            </p>
        </div>
    </main>

    <script>
        /**
         * 1. ข้อมูลเว็บไซต์ (แก้ไขตรงนี้ได้เลย!)
         */
        const SITE_DATA = {
            links: {
                youtube: "https://www.youtube.com/...",
                line: "https://line.me/ti/p/...",
                facebook: "https://www.facebook.com/...",
                instagram: "https://www.instagram.com/..."
            },
            lang: {
                en: {
                    btn: "TH",
                    bio: "Contact me through the channels below",
                    footer: "© 2026 • Nice Digital Card"
                },
                th: {
                    btn: "EN",
                    bio: "เลือกช่องทางติดต่อด้านล่างได้เลยครับ",
                    footer: "© 2569 • นามบัตรดิจิทัลของไนซ์"
                }
            }
        };

        /**
         * 2. ระบบจัดการสถานะ (Theme & Language)
         */
        let currentLang = localStorage.getItem('lang') || 'en';
        let isDark = localStorage.getItem('theme') === 'dark';

        function updateUI() {
            // อัปเดตธีม
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }

            // อัปเดตภาษา
            const content = SITE_DATA.lang[currentLang];
            document.getElementById('lang-label').innerText = content.btn;
            document.getElementById('ui-bio').innerText = content.bio;
            document.getElementById('ui-footer').innerText = content.footer;

            // อัปเดตทุกลิงก์
            document.getElementById('link-youtube').href = SITE_DATA.links.youtube;
            document.getElementById('link-line').href = SITE_DATA.links.line;
            document.getElementById('link-facebook').href = SITE_DATA.links.facebook;
            document.getElementById('link-instagram').href = SITE_DATA.links.instagram;

            // บันทึกค่าลงเครื่อง
            localStorage.setItem('lang', currentLang);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        /**
         * 3. ฟังก์ชันสลับสถานะ
         */
        function toggleLang() {
            currentLang = currentLang === 'en' ? 'th' : 'en';
            updateUI();
        }

        function toggleTheme() {
            isDark = !isDark;
            updateUI();
        }

        // เริ่มทำงานเมื่อโหลดหน้าเสร็จ
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
