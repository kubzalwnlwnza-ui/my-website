<!doctype html>
<html lang="en" class="h-full transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice | Digital Business Card</title>
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        // Tailwind Config สำหรับ Dark Mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        * { font-family: 'Prompt', sans-serif; }
        
        /* Light Mode Background */
        body { background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%); transition: background 0.5s ease; }
        /* Dark Mode Background */
        .dark body { background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }

        /* --- Micro-interactions: ปุ่ม Glassmorphism --- */
        .glass-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            /* เพิ่ม transition สำหรับทุก Property เพื่อความลื่นไหล */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .dark .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Hover Effect สำหรับปุ่ม: ลอยขึ้นและเพิ่มเงา */
        .glass-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.8);
        }

        .dark .glass-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Micro-interaction: ไอคอนด้านในปุ่ม */
        .glass-btn .icon-box {
            transition: transform 0.3s ease; /* transition สำหรับไอคอนแยกต่างหาก */
        }

        /* Hover ที่ปุ่ม -> ไอคอนขยายและหมุน */
        .glass-btn:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        /* --- Micro-interactions: ปุ่ม Settings Bar --- */
        .settings-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .dark .settings-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .settings-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.9);
        }
        .dark .settings-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- Animation ตอนเข้าเว็บ --- */
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .fade-in { opacity: 0; animation: fadeInUp 0.8s ease-out forwards; }
    </style>
</head>

<body class="h-full text-slate-800 dark:text-slate-200">
    <div class="fixed top-6 right-6 flex gap-3 z-50 fade-in" style="animation-delay: 0.8s;">
        <button onclick="toggleLang()" class="w-10 h-10 rounded-full settings-btn flex items-center justify-center font-bold text-xs uppercase shadow-sm">
            <span id="lang-label">TH</span>
        </button>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full settings-btn flex items-center justify-center shadow-sm text-lg">
            <span id="theme-icon">🌙</span>
        </button>
    </div>

    <main class="min-h-full w-full flex items-center justify-center p-6">
        <div class="w-full max-w-sm">
            
            <div class="text-center mb-12 fade-in" style="animation-delay: 0.1s;">
                <div class="relative w-28 h-28 mx-auto mb-6">
                    <div class="absolute inset-0 rounded-full border-2 border-dashed border-sky-500/30 animate-[spin_15s_linear_infinite]"></div>
                    
                    <div class="w-full h-full rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 shadow-2xl flex items-center justify-center border-4 border-white/10 dark:border-white/20">
                        <span class="text-4xl font-bold text-white tracking-tighter shadow-sm">N</span>
                    </div>
                </div>
                
                <h1 id="ui-name" class="text-2xl font-semibold tracking-tight dark:text-white mb-1">Nice</h1>
                <p id="ui-job" class="text-sky-600 dark:text-sky-400 text-xs font-medium mb-2 uppercase tracking-widest">Digital Business Card</p>
                <p id="ui-bio" class="text-slate-500 dark:text-slate-400 text-sm font-light px-4">Contact me through the channels below</p>
            </div>

            <div class="space-y-4">
                
                <a id="link-youtube" href="#" target="_blank" class="glass-btn flex items-center p-4 rounded-2xl fade-in" style="animation-delay: 0.2s;">
                    <div class="icon-box w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center text-red-500 mr-4 shadow-inner">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-sm font-medium dark:text-white">YouTube</p>
                        <p id="sub-youtube" class="text-xs text-slate-400">Favorite songs lately</p>
                    </div>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>

                <a id="link-line" href="#" target="_blank" class="glass-btn flex items-center p-4 rounded-2xl fade-in" style="animation-delay: 0.3s;">
                    <div class="icon-box w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-500 mr-4 shadow-inner">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-sm font-medium dark:text-white">LINE</p>
                        <p id="sub-line" class="text-xs text-slate-400">ID LINE niceown</p>
                    </div>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>

                <a id="link-facebook" href="#" target="_blank" class="glass-btn flex items-center p-4 rounded-2xl fade-in" style="animation-delay: 0.4s;">
                    <div class="icon-box w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-500 mr-4 shadow-inner">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-sm font-medium dark:text-white">Facebook</p>
                        <p id="sub-facebook" class="text-xs text-slate-400">Follow me on Facebook</p>
                    </div>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>

                <a id="link-instagram" href="#" target="_blank" class="glass-btn flex items-center p-4 rounded-2xl fade-in" style="animation-delay: 0.5s;">
                    <div class="icon-box w-10 h-10 rounded-xl bg-pink-500/10 flex items-center justify-center text-pink-500 mr-4 shadow-inner">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-sm font-medium dark:text-white">Instagram</p>
                        <p id="sub-instagram" class="text-xs text-slate-400">@kkiir_rl</p>
                    </div>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>
            </div>

            <p id="ui-footer" class="text-center mt-12 text-[10px] tracking-[0.2em] uppercase text-slate-400 fade-in" style="animation-delay: 0.7s;">
                © 2026 • Nice Digital Card
            </p>
        </div>
    </main>

    <script>
        // 1. Data Structure
        const LANG_DATA = {
            en: {
                label: "TH", 
                bio: "Contact me through the channels below",
                yt: "Favorite songs lately",
                line: "ID LINE niceown",
                fb: "Follow me on Facebook",
                ig: "@kkiir_rl",
                footer: "© 2026 • Nice Digital Card"
            },
            th: {
                label: "EN",
                bio: "เลือกช่องทางติดต่อด้านล่างได้เลยครับ",
                yt: "เพลงที่ชอบในช่วงนี้",
                line: "ไอดีไลน์ niceown",
                fb: "ติดตามข่าวสารใหม่ๆ",
                ig: "ดูรูปภาพของฉัน",
                footer: "© 2569 • นามบัตรดิจิทัลของไนซ์"
            }
        };

        const MY_LINKS = {
            youtube: "https://www.youtube.com/watch?v=PeuK3febyAY&list=RDPeuK3febyAY&start_radio=1",
            line: "https://line.me/ti/p/hIPTz_WZja", 
            facebook: "https://www.facebook.com/share/17Ko9R6yy2/",
            instagram: "https://www.instagram.com/kkiir_rl?igsh=OWNuOXZtb21nOTdq"
        };

        // 2. Global State
        let currentLang = localStorage.getItem('lang') || 'en';
        let isDark = localStorage.getItem('theme') === 'dark';

        // 3. Functions
        function applySettings() {
            // Theme
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }

            // Language
            const data = LANG_DATA[currentLang];
            document.getElementById('lang-label').innerText = data.label;
            document.getElementById('ui-bio').innerText = data.bio;
            document.getElementById('sub-youtube').innerText = data.yt;
            document.getElementById('sub-line').innerText = data.line;
            document.getElementById('sub-facebook').innerText = data.fb;
            document.getElementById('sub-instagram').innerText = data.ig;
            document.getElementById('ui-footer').innerText = data.footer;
            
            // Links
            Object.keys(MY_LINKS).forEach(key => {
                const el = document.getElementById(`link-${key}`);
                if(el) el.href = MY_LINKS[key];
            });

            // Save preferences
            localStorage.setItem('lang', currentLang);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'th' : 'en';
            applySettings();
        }

        function toggleTheme() {
            isDark = !isDark;
            applySettings();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', applySettings);
    </script>
</body>
</html>
