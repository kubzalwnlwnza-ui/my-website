<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Business Card</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    /* ╔════════════════════════════════════╗
       ║ 1. ตั้งค่าพื้นฐาน
       ╚════════════════════════════════════╝ */
    * {
      font-family: 'Prompt', sans-serif;
    }

    /* ╔════════════════════════════════════╗
       ║ 2. พื้นหลัง
       ╚════════════════════════════════════╝ */
    .card-gradient {
      background: linear-gradient(135deg, var(--bg-color) 0%, color-mix(in srgb, var(--bg-color) 80%, black) 100%);
    }

    /* ╔════════════════════════════════════╗
       ║ 3. โปรไฟล์รูป
       ╚════════════════════════════════════╝ */
    /* ขอบสีรุ้ง */
    .profile-ring {
      background: conic-gradient(from 0deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
      padding: 4px;
      animation: rotate 4s linear infinite;
    }

    /* โปรไฟล์ลอยขึ้นลง */
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }

    /* ╔════════════════════════════════════╗
       ║ 4. ปุ่มโซเชียลมีเดีย
       ╚════════════════════════════════════╝ */
    .social-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .social-btn:active {
      transform: translateY(-2px) scale(1.01);
    }

    /* ╔════════════════════════════════════╗
       ║ 5. อนิเมชั่น
       ╚════════════════════════════════════╝ */
    /* หมุนขอบรูป */
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ลอยขึ้นลง */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* เฟดเข้าขึ้น */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    /* ความล่าช้าสำหรับแต่ละเอลิเมนต์ */
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
    .delay-5 { animation-delay: 0.5s; }
    .delay-6 { animation-delay: 0.6s; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>

  <script>
    // ═══════════════════════════════════════════════
    // ① ตั้งค่าเริ่มต้น (Default Config)
    // ═══════════════════════════════════════════════
    const defaultConfig = {
      // ข้อมูลส่วนตัว
      display_name: 'ชื่อของคุณ',
      job_title: 'ตำแหน่ง / อาชีพ',
      bio_text: 'เขียนคำแนะนำตัวสั้นๆ ของคุณที่นี่',

      // ลิงค์โซเชียลมีเดีย
      youtube_url: 'https://youtube.com',
      line_id: '',
      facebook_url: 'https://facebook.com',
      instagram_url: 'https://instagram.com',

      // สี
      background_color: '#1a1a2e',
      card_color: '#16213e',
      text_color: '#eaeaea',
      secondary_text_color: '#a0a0a0',
      accent_color: '#ff6b6b'
    };

    // ═══════════════════════════════════════════════
    // ② ฟังก์ชันแปลงค่าเมื่อเปลี่ยนแปลง
    // ═══════════════════════════════════════════════
    async function onConfigChange(config) {
      // 更新ข้อความ
      document.getElementById('display-name').textContent = config.display_name || defaultConfig.display_name;
      document.getElementById('job-title').textContent = config.job_title || defaultConfig.job_title;
      document.getElementById('bio-text').textContent = config.bio_text || defaultConfig.bio_text;
      
      // ═══ YouTube ═══
      const youtubeUrl = config.youtube_url || defaultConfig.youtube_url;
      document.getElementById('youtube-link').href = youtubeUrl.startsWith('http') ? youtubeUrl : `https://${youtubeUrl}`;
      
      // ═══ LINE ═══
      const lineId = config.line_id || '';
      const lineLink = document.getElementById('line-link');
      if (lineId) {
        lineLink.href = `https://line.me/ti/p/~${lineId}`;
        document.getElementById('line-id-display').textContent = `ID: ${lineId}`;
      } else {
        lineLink.href = 'https://line.me';
        document.getElementById('line-id-display').textContent = 'แชทกับฉัน';
      }
      
      // ═══ Facebook ═══
      const facebookUrl = config.facebook_url || defaultConfig.facebook_url;
      document.getElementById('facebook-link').href = facebookUrl.startsWith('http') ? facebookUrl : `https://${facebookUrl}`;
      
      // ═══ Instagram ═══
      const instagramUrl = config.instagram_url || defaultConfig.instagram_url;
      document.getElementById('instagram-link').href = instagramUrl.startsWith('http') ? instagramUrl : `https://${instagramUrl}`;
      
      // ═══ สี ═══
      const bgColor = config.background_color || defaultConfig.background_color;
      const cardColor = config.card_color || defaultConfig.card_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const secondaryTextColor = config.secondary_text_color || defaultConfig.secondary_text_color;
      
      document.getElementById('app-container').style.setProperty('--bg-color', bgColor);
      document.getElementById('profile-avatar').style.backgroundColor = cardColor;
      
      document.getElementById('display-name').style.color = textColor;
      document.getElementById('job-title').style.color = secondaryTextColor;
      document.getElementById('bio-text').style.color = secondaryTextColor;
      
      // ═══ ปุ่มโซเชียล ═══
      const socialBtns = document.querySelectorAll('.social-btn');
      socialBtns.forEach(btn => {
        btn.style.backgroundColor = cardColor;
        btn.querySelector('.font-semibold').style.color = textColor;
        btn.querySelectorAll('p')[1].style.color = secondaryTextColor;
        btn.querySelector('svg:last-child').style.color = secondaryTextColor;
      });
    }

    // ═══════════════════════════════════════════════
    // ③ ฟังก์ชันจัดการสี (Capabilities)
    // ═══════════════════════════════════════════════
    function mapToCapabilities(config) {
      return {
        // สีที่สามารถแก้ไขได้
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => { config.card_color = value; window.elementSdk.setConfig({ card_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => config.secondary_text_color || defaultConfig.secondary_text_color,
            set: (value) => { config.secondary_text_color = value; window.elementSdk.setConfig({ secondary_text_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    // ═══════════════════════════════════════════════
    // ④ ฟังก์ชันจัดการแบบแก้ไขข้อความ
    // ═══════════════════════════════════════════════
    function mapToEditPanelValues(config) {
      return new Map([
        ['display_name', config.display_name || defaultConfig.display_name],
        ['job_title', config.job_title || defaultConfig.job_title],
        ['bio_text', config.bio_text || defaultConfig.bio_text],
        ['youtube_url', config.youtube_url || defaultConfig.youtube_url],
        ['line_id', config.line_id || defaultConfig.line_id],
        ['facebook_url', config.facebook_url || defaultConfig.facebook_url],
        ['instagram_url', config.instagram_url || defaultConfig.instagram_url]
      ]);
    }

    // ═══════════════════════════════════════════════
    // ⑤ เริ่มต้น SDK
    // ═══════════════════════════════════════════════
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
